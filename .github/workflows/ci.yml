# Test and build on every push and pull request; see docs/CI.md.
# Both jobs run the same thing, tools/ci/run.sh: the workflow only sets up the
# .NET SDK, restores the NuGet cache and calls it.
#
# The hosted job's runner comes from the repository variable CI_RUNS_ON (a JSON
# string or label array), default GitHub's ubuntu-latest. The self-hosted job
# only exists when the repository variable CI_SELF_HOSTED is "true".
#
# Neither job has a game installation, so tools/fetch-dalamud.sh pulls the public
# Dalamud reference assemblies into ./.dalamud first and DALAMUD_LIB_PATH points at
# them; that is what lets the Dalamud projects and tests/XivMcp.Plugin.Tests run
# here. Without them tools/ci/run.sh skips both with a message instead of failing.
# The package stage runs tools/package.sh, so the release path is exercised on
# every push rather than first on a tag.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The honest probe is global.json's own: `dotnet --version` in the checkout
      # fails unless an installed SDK satisfies the pin. "Some 10.x is present" is
      # not enough — a runner image with 10.0.400 does not satisfy 10.0.401.
      - name: Probe for the pinned .NET SDK
        id: dotnet
        run: |
          if command -v dotnet >/dev/null && dotnet --version >/dev/null 2>&1; then
            echo "have=true" >>"$GITHUB_OUTPUT"
          else
            echo "have=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install the .NET SDK
        if: steps.dotnet.outputs.have != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/xiv-mcp-ci/nuget
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'XivMcp.slnx', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Check the plugin manifest
        run: tools/check-manifest.py

      - name: Fetch the Dalamud reference assemblies
        run: tools/fetch-dalamud.sh

      - name: Test, build and package
        env:
          DALAMUD_LIB_PATH: ${{ github.workspace }}/.dalamud
        run: tools/ci/run.sh test build package

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiv-mcp-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  # The same stages on the owner's runner, which can carry the Dalamud reference
  # assemblies. A self-hosted runner executes whatever a workflow asks for, so a
  # pull request from a fork must never reach it: the `if` below runs the job
  # only for events from this repository, and only while CI_SELF_HOSTED is
  # "true" (an offline runner then just queues nothing). The xiv-mcp label keeps
  # other repositories' jobs off it. No environment or secret is involved.
  self-hosted:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, Linux, X64, xiv-mcp]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The honest probe is global.json's own: `dotnet --version` in the checkout
      # fails unless an installed SDK satisfies the pin. "Some 10.x is present" is
      # not enough — a runner image with 10.0.400 does not satisfy 10.0.401.
      - name: Probe for the pinned .NET SDK
        id: dotnet
        run: |
          if command -v dotnet >/dev/null && dotnet --version >/dev/null 2>&1; then
            echo "have=true" >>"$GITHUB_OUTPUT"
          else
            echo "have=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Install the .NET SDK
        if: steps.dotnet.outputs.have != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/xiv-mcp-ci/nuget
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'XivMcp.slnx', 'global.json', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Check the plugin manifest
        run: tools/check-manifest.py

      - name: Fetch the Dalamud reference assemblies
        run: tools/fetch-dalamud.sh

      - name: Test, build and package
        env:
          DALAMUD_LIB_PATH: ${{ github.workspace }}/.dalamud
        run: tools/ci/run.sh test build package

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xiv-mcp-self-hosted-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
