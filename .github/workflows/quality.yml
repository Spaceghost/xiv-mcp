# Secret scan on every push and pull request, fuzzing every night. The
# analyzers (warnings are errors) and the tests run in ci.yml. GitHub-hosted
# runners, no secrets: pull requests from forks run the same jobs.
name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Fuzz time budget in seconds
        default: '1200'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Fuzz the MCP request handling
        env:
          XIVMCP_FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '1200' }}
        run: |
          set -o pipefail
          dotnet test tests/XivMcp.Core.Tests --filter "FullyQualifiedName~FuzzTests" 2>&1 | tee fuzz.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ github.run_id }}
          path: fuzz.log
          if-no-files-found: ignore
      - name: Report on the fuzz issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown
          body="$(printf 'Fuzz run %s failed:\n\n```\n%s\n```\nReplay with XIVMCP_FUZZ_SEED set to the seed above.' "$RUN_URL" "$(grep -m5 -i 'seed' fuzz.log || echo 'no seed in the log: the build failed')")"
          gh label create fuzz-crash --color B60205 --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          n="$(gh issue list --repo "$GITHUB_REPOSITORY" --label fuzz-crash --state open --json number --jq '.[0].number')"
          if [[ -n "$n" ]]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --label fuzz-crash --title "Fuzzing found a failure" --body "$body"; fi
