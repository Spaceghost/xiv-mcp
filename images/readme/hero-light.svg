    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3a70" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#071230" stop-opacity="0.9"/>
